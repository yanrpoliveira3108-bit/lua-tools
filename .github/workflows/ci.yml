name: Lua Tools CI - yna.019

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check compile
        run: |
          python -m py_compile main.py database.py cogs/*.py dashboard/app.py
          echo "✅ Todos cogs compilaram - Lua Tools yna.019"
      - name: Check DB init
        run: |
          python -c "import asyncio, database; asyncio.run(database.init_db())"
          echo "✅ DB 18 tabelas OK"
